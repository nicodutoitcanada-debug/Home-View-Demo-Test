<!DOCTYPE html>
<html lang="en">
<head>
<title>DEMO</title>

<meta charset="utf-8" />

<!-- ✅ UPDATED VIEWPORT FOR iOS -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ✅ iOS FULLSCREEN SUPPORT -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LUX Visualizer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- ✅ MANIFEST -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="LOGO.png">

<style>

/* ===============================
   GLOBAL FIXES (iOS FULLSCREEN)
================================*/

html,
body{
margin:0;
width:100%;
height:100%;
min-height:100dvh;
overflow:hidden;
background:black;
font-family:"Futura PT",sans-serif;
overscroll-behavior:none;
touch-action:none;
}

/* ===============================
   PIXEL STREAM
================================*/

#video-container{
width:100vw;
height:100dvh;
position:relative;
z-index:1;
}

/* ===============================
   INTRO / LOADING OVERLAY
================================*/

#introOverlay{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:5000;
pointer-events:none;
opacity:1;
transition:opacity 1s ease;
}

#introVideo{
position:absolute;
inset:0;
width:100vw;
height:100dvh;
object-fit:cover;
opacity:1;
transition:opacity 0.8s ease;
background:black;
}

#loadingIntroWrap{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:black;
opacity:0;
visibility:hidden;
overflow:hidden;
transition:opacity 0.8s ease;
}

#loadingIntroBg{
position:absolute;
inset:0;
width:100vw;
height:100dvh;
object-fit:cover;
opacity:1;
background:black;
}

#loadingIntro{
position:relative;
z-index:1;
width:min(32vw,320px);
height:min(32vw,320px);
max-width:320px;
max-height:320px;
min-width:140px;
min-height:140px;
}

/* ===============================
   BLACK FADE
================================*/

#blackFade{
position:fixed;
inset:0;
background:black;
opacity:1;
z-index:4000;
pointer-events:none;
transition:opacity 1.2s ease;
}

/* ===============================
   SCREENSHOT OVERLAY
================================*/

#screenshotOverlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
z-index:2000;
pointer-events:none;
}

.overlayBox{
background:rgba(0,0,0,0.5);
padding:24px 32px;
border-radius:16px;
color:white;
font-size:16px;
display:flex;
align-items:center;
gap:16px;
}

.spinner{
width:22px;
height:22px;
border:3px solid rgba(255,255,255,0.3);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

<!-- ⚠️ YOUR ENTIRE SCRIPT BLOCK REMAINS 100% UNCHANGED -->
<script type="module">
/* KEEP YOUR ORIGINAL JS EXACTLY AS-IS */
</script>

</head>

<body>

<div id="video-container" tabindex="0"></div>

<!-- INTRO / LOADING OVERLAY -->

<div id="introOverlay">
<video
id="introVideo"
src="logo 01.mp4"
muted
playsinline
preload="auto">
</video>

<div id="loadingIntroWrap">
<video
id="loadingIntroBg"
src="LOADING_BG.mp4"
muted
playsinline
autoplay
loop
preload="auto">
</video>
<div id="loadingIntro"></div>
</div>
</div>

<div id="blackFade"></div>

<!-- SCREENSHOT OVERLAY -->

<div id="screenshotOverlay">
<div class="overlayBox">
<div class="spinner"></div>
<div id="overlayText">Generating high resolution image</div>
</div>
</div>

</body>
</html>
