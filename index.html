<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Pixel Streaming</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="player"></div>

  <script type="module">
    import { PixelStreaming } from "https://unpkg.com/@arcware-cloud/pixelstreaming-websdk@1.3.32/dist/index.esm.js";

    const config = {
      useUrlParams: true,
      initialSettings: {
        AutoConnect: true,
        AutoPlayVideo: true,
        StartVideoMuted: true
      }
    };

    const pixelStreaming = new PixelStreaming(config);

    pixelStreaming.connect();
  </script>
</body>
</html>
