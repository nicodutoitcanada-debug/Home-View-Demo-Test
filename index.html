<!DOCTYPE html>
<html lang="en">
<head>
<title>HOME VIEW DEMO</title>

<style>
body {
    background-color: rgb(208, 208, 208);
    margin: 0;
    overflow: hidden;
}
#video-container {
    width: 100vw;
    height: 100vh;
    position: relative;
}
</style>
</head>

<body>

<div id="video-container"></div>

<!-- ✅ Use UMD build instead of ESM -->
<script src="https://unpkg.com/@arcware-cloud/pixelstreaming-websdk@1.3.32/dist/index.umd.js"></script>

<script>

let Application;
let screenshotCounter = 1;

(async () => {

    const { ArcwareInit } = window.ArcwarePixelStreamingWebSdk;

    const initResult = new ArcwareInit(
        {
            shareId: "share-49b3b4a2-4484-4850-b567-5ad8d7ac0df8",
        },
        {
            initialSettings: {
                StartVideoMuted: false,
                AutoConnect: true,
                AutoPlayVideo: true,
            },
            settings: {
                infoButton: false,
                micButton: false,
                audioButton: false,
                fullscreenButton: true,
                settingsButton: false,
                connectionStrengthIcon: false,
            },
        }
    );

    Application = initResult.Application;

    Application.getApplicationResponse((response) => {

        try {
            const parsed = JSON.parse(response);

            if (parsed.home === "loaded") {
                Application.emitUIInteraction({ level: "homeView" });
            }

        } catch (e) {}

        if (response.startsWith("CreateScreenshot")) {
            createFile(window.file);
        }
    });

    setTimeout(() => {
        document
            .getElementById("video-container")
            .appendChild(Application.rootElement);
    }, 200);

    window.file = Application.webRtcController.file;

})();

function createFile(file) {

    const blob = new Blob(file.data, { type: file.mimetype });
    const counterString = String(screenshotCounter).padStart(2, "0");
    const fileName = `screenshot${counterString}${file.extension}`;

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);

    screenshotCounter++;
}

</script>

</body>
</html>
