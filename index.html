<!DOCTYPE html>
<html lang="en">
<head>
<title>HOME VIEW DEMO</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:"Futura PT",sans-serif;
}

/* ===============================
   PIXEL STREAM
================================*/

#video-container{
width:100vw;
height:100vh;
position:relative;
z-index:1;
}

/* ===============================
   LOADING OVERLAY
================================*/

#loadingOverlay{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:5000;
opacity:1;
transition:opacity 0.75s ease;
}

/* Logo */

#mainLogo{
width:220px;
opacity:0;
transform:scale(0.94);
animation:logoIn 1.2s ease forwards;
}

@keyframes logoIn{
to{
opacity:1;
transform:scale(1);
}
}

/* Loading row */

#loadingRow{
margin-top:24px;
display:flex;
align-items:center;
gap:12px;
opacity:0;
animation:fadeIn 1s ease forwards;
animation-delay:0.6s;
}

@keyframes fadeIn{
to{opacity:1;}
}

/* Spinner */

.spinner{
width:18px;
height:18px;
border:3px solid rgba(255,255,255,0.3);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

/* Animated text */

#loadingText{
color:white;
font-size:14px;
letter-spacing:2px;
white-space:nowrap;
overflow:hidden;
border-right:2px solid white;
width:0;
animation:typing 2s steps(22,end) forwards, blink 1s infinite;
animation-delay:0.8s;
}

@keyframes typing{
to{width:260px;}
}

@keyframes blink{
50%{border-color:transparent;}
}

/* ===============================
   SCREENSHOT OVERLAY
================================*/

#screenshotOverlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
z-index:2000;
pointer-events:none;
}

.overlayBox{
background:rgba(0,0,0,0.5);
padding:24px 32px;
border-radius:16px;
color:white;
font-size:16px;
display:flex;
align-items:center;
gap:16px;
}

</style>


<script type="module">

let Application;
let screenshotCounter = 1;

import * as PixelStreamingWebSdk from
"https://unpkg.com/@arcware-cloud/pixelstreaming-websdk@1.3.32/index.mjs";

(() => {

const { ArcwareInit } = PixelStreamingWebSdk;

const shareIds=[
"share-49b3b4a2-4484-4850-b567-5ad8d7ac0df8"
];

const selectedShareId=
shareIds[Math.floor(Math.random()*shareIds.length)];

const initResult=new ArcwareInit(
{shareId:selectedShareId},
{
initialSettings:{
AutoConnect:true,
AutoPlayVideo:true,
StartVideoMuted:false
},
settings:{
infoButton:false,
micButton:false,
audioButton:false,
fullscreenButton:false,
settingsButton:false,
connectionStrengthIcon:false
}
}
);

Application=initResult.Application;

/* ===============================
   RESPONSES FROM UNREAL
================================*/

Application.getApplicationResponse((response)=>{

try{

const parsed=JSON.parse(response);

/* GAME LOADED → request level */

if(parsed.Game==="Loaded"){
Application.emitUIInteraction(JSON.stringify({
load:"homeViewDemo"
}));
}

/* LEVEL READY → fade out overlay */

if(parsed.Game==="HomeViewLevelLoaded"){
fadeOutLoading();
}

/* screenshot handling */

if(parsed.screenshot==="generating"){
showOverlay("Generating high resolution image");
}

}catch(e){}

if(response.startsWith("CreateScreenshot")){
createFile(window.file);
}

});

/* ===============================
   ATTACH STREAM
================================*/

setTimeout(()=>{
document
.getElementById("video-container")
.appendChild(Application.rootElement);
});

window.file=Application.webRtcController.file;

})();

/* ===============================
   FADE OUT LOADING
================================*/

function fadeOutLoading(){

const overlay=document.getElementById("loadingOverlay");

overlay.style.opacity=0;

setTimeout(()=>{
overlay.remove();
},750);

}

/* ===============================
   SCREENSHOT FUNCTIONS
================================*/

function showOverlay(message){
document.getElementById("overlayText").innerText=message;
document.getElementById("screenshotOverlay").style.display="flex";
}

function hideOverlay(){
document.getElementById("screenshotOverlay").style.display="none";
}

function createFile(file){

const blob=new Blob(file.data,{type:file.mimetype});
const counterString=String(screenshotCounter).padStart(2,"0");
const fileName=`screenshot${counterString}${file.extension}`;

if(window.showSaveFilePicker){

(async()=>{
try{
const handle=await window.showSaveFilePicker({
suggestedName:fileName,
types:[{description:"PNG Image",accept:{"image/png":[".png"]}}]
});

hideOverlay();

const writable=await handle.createWritable();
await writable.write(blob);
await writable.close();

}catch(err){
hideOverlay();
}
})();

}else{

const url=URL.createObjectURL(blob);
const a=document.createElement("a");

a.href=url;
a.download=fileName;

document.body.appendChild(a);
a.click();
document.body.removeChild(a);

URL.revokeObjectURL(url);

document.getElementById("overlayText").innerText=
"Your image has been saved";

setTimeout(hideOverlay,2000);

}

screenshotCounter++;

}

</script>

</head>


<body>

<div id="video-container"></div>

<!-- LOADING OVERLAY -->

<div id="loadingOverlay">

<img id="mainLogo" src="logo_2.png">

<div id="loadingRow">
<div class="spinner"></div>
<div id="loadingText">LOADING HOME VIEW DEMO</div>
</div>

</div>

<!-- SCREENSHOT OVERLAY -->

<div id="screenshotOverlay">
<div class="overlayBox">
<div class="spinner"></div>
<div id="overlayText">Generating high resolution image</div>
</div>
</div>

</body>
</html>
