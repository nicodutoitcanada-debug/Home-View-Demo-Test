<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Hotspot Hero — optimized mobile</title>

  <style>
    :root {
      --hotspot-size: clamp(44px, 3.2vw, 58px);
      --menu-height: clamp(150px, 19vh, 230px);
      --glass-blur: 10px;
      background: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    button { font: inherit; }

    #hero {
      --pan-position: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #hero.pan-enabled { touch-action: pan-y; }

    .hero-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--pan-position) center;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #hero-high-res {
      z-index: 1;
      opacity: 0;
      transition: opacity 220ms linear;
    }

    #hero-high-res.is-visible { opacity: 1; }

    #hero.scrolling-away #hero-high-res { opacity: 0; }

    /* Product playback always takes visual priority over the scroll-zoom layer. */
    #hero.product-flow #hero-sequence {
      opacity: 0;
      visibility: hidden;
    }

    #hero.product-flow #hero-high-res {
      opacity: 1;
      transition: none;
    }

    #over-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .product-over {
      opacity: 0;
      transition: opacity 520ms ease;
    }

    .product-over.is-visible { opacity: 1; }

    #hotspot-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      display: grid;
      width: var(--hotspot-size);
      height: var(--hotspot-size);
      padding: 0;
      place-items: center;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.16);
      border: 0;
      border-radius: 50%;
      background: #050505;
      box-shadow: 0 0 0 11px rgba(0, 0, 0, 0.16);
      cursor: pointer;
      pointer-events: none;
      transition:
        opacity 580ms ease var(--hide-delay, 0ms),
        transform 780ms cubic-bezier(0.22, 1, 0.36, 1) var(--hide-delay, 0ms),
        box-shadow 180ms ease;
    }

    .hotspot::after {
      position: absolute;
      inset: -8px;
      z-index: -1;
      border: 4px solid rgba(0, 0, 0, 0.58);
      border-radius: 50%;
      content: "";
      opacity: 0;
      transform: scale(0.78);
      animation: hotspot-pulse 2.35s ease-out infinite;
      animation-delay: calc(var(--show-delay, 0ms) + 700ms);
      animation-play-state: paused;
    }

    #hero.hotspots-visible .hotspot {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      transition-delay: var(--show-delay, 0ms), var(--show-delay, 0ms), 0ms;
    }

    #hero.hotspots-visible .hotspot::after {
      animation-play-state: running;
    }

    #hero.hotspots-visible .hotspot:hover,
    #hero.hotspots-visible .hotspot:focus-visible {
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 0 0 13px rgba(0, 0, 0, 0.22);
      outline: none;
      transition-delay: 0ms;
    }

    @keyframes hotspot-pulse {
      0% {
        opacity: 0;
        transform: scale(0.78);
      }
      20% { opacity: 0.48; }
      72%, 100% {
        opacity: 0;
        transform: scale(1.45);
      }
    }

    .hotspot img,
    .hotspot svg {
      display: block;
      width: 48%;
      height: 48%;
      object-fit: contain;
      color: #fff;
      filter: brightness(0) invert(1);
      pointer-events: none;
    }

    #product-menu {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      height: var(--menu-height);
      padding: 18px clamp(16px, 3vw, 54px) max(18px, env(safe-area-inset-bottom, 0px));
      background: rgba(0, 0, 0, 0.30);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(var(--glass-blur));
      backdrop-filter: blur(var(--glass-blur));
      opacity: 0;
      transform: translateY(24px);
      pointer-events: none;
      transition:
        opacity 1100ms ease,
        transform 1350ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #hero.ui-ready #product-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #hero.sequence-active #product-menu {
      opacity: 0;
      transform: translateY(24px);
      pointer-events: none;
    }

    #pan-controls {
      position: absolute;
      bottom: calc(var(--menu-height) + 14px);
      left: 50%;
      z-index: 6;
      display: flex;
      width: min(760px, calc(100% - 24px));
      height: 56px;
      padding: 8px 10px;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.30);
      -webkit-backdrop-filter: blur(var(--glass-blur));
      backdrop-filter: blur(var(--glass-blur));
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      opacity: 0;
      transform: translate(-50%, 18px) scale(0.98);
      pointer-events: none;
      transition:
        opacity 760ms ease,
        transform 980ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #hero.pan-enabled.ui-ready:not(.sequence-active) #pan-controls {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      pointer-events: auto;
    }

    .pan-arrow {
      display: grid;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      padding: 0;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      color: #fff;
      background: rgba(0, 0, 0, 0.34);
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .pan-arrow svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.4;
    }

    .pan-arrow:hover,
    .pan-arrow:focus-visible {
      color: #ffc01e;
      background: rgba(255, 192, 30, 0.16);
      outline: none;
      transform: scale(1.08);
    }

    #pan-slider {
      --slider-fill: 50%;
      flex: 1 1 auto;
      min-width: 0;
      height: 42px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      touch-action: none;
    }

    #pan-slider:active { cursor: grabbing; }

    #pan-slider::-webkit-slider-runnable-track {
      height: 5px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: linear-gradient(
        to right,
        #fff 0,
        #fff var(--slider-fill),
        rgba(255, 255, 255, 0.22) var(--slider-fill),
        rgba(255, 255, 255, 0.22) 100%
      );
    }

    #pan-slider::-webkit-slider-thumb {
      width: 42px;
      height: 42px;
      margin-top: -19px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff 0 9px, transparent 10px);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    #pan-slider::-moz-range-track {
      height: 5px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    #pan-slider::-moz-range-progress {
      height: 5px;
      border-radius: 999px;
      background: #fff;
    }

    #pan-slider::-moz-range-thumb {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff 0 9px, transparent 10px);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .product-button {
      display: flex;
      min-width: 0;
      padding: 12px 8px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      border: 0;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }

    .product-button__icon {
      display: grid;
      width: 52px;
      height: 34px;
      place-items: center;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .product-button__icon img,
    .product-button__icon svg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      color: #fff;
      filter: brightness(0) invert(1);
    }

    .product-button__label {
      overflow: hidden;
      max-width: 100%;
      font-size: clamp(11px, 0.82vw, 14px);
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-button:hover .product-button__icon,
    .product-button:focus-visible .product-button__icon {
      opacity: 0.8;
      transform: translateY(-3px) scale(1.06);
    }

    .product-button:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.65);
      outline-offset: -4px;
    }

    #dialog-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      padding: clamp(18px, 4vw, 60px);
      place-items: center;
      opacity: 0;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.58);
      pointer-events: none;
      transition: opacity 420ms ease, visibility 0s linear 520ms;
    }

    #dialog-layer.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 420ms ease, visibility 0s;
    }

    #product-dialog {
      overflow: hidden;
      width: min(980px, 88vw);
      max-height: min(700px, 82vh);
      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 16px;
      background: transparent;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
      opacity: 0;
      transform: scale(0.68) translateY(30px);
      transform-origin: center;
      transition:
        opacity 380ms ease,
        transform 950ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #dialog-layer.is-open #product-dialog {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .dialog-header,
    .dialog-footer {
      display: flex;
      min-height: 78px;
      padding: 16px 22px;
      align-items: center;
      color: #111;
      background: #fff;
    }

    .dialog-header { justify-content: space-between; }

    #dialog-brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-size: 15px;
      font-weight: 700;
    }

    #dialog-brand img,
    #dialog-brand svg {
      display: block;
      width: auto;
      max-width: min(190px, 42vw);
      height: 44px;
      object-fit: contain;
      filter: brightness(0);
    }

    #dialog-brand.is-custom img { filter: none; }

    #dialog-close {
      display: grid;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #222;
      background: #ececec;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    #dialog-close:hover,
    #dialog-close:focus-visible {
      background: #ddd;
      outline: none;
      transform: rotate(90deg) scale(1.06);
    }

    .dialog-body {
      overflow-y: auto;
      max-height: calc(min(700px, 82vh) - 150px);
      padding: clamp(24px, 4vw, 48px);
      color: #fff;
      background: rgba(0, 0, 0, 0.30);
      -webkit-backdrop-filter: blur(var(--glass-blur));
      backdrop-filter: blur(var(--glass-blur));
    }

    .dialog-eyebrow {
      margin: 0 0 8px;
      color: rgba(255, 255, 255, 0.56);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    #dialog-title {
      margin: 0 0 12px;
      font-size: clamp(24px, 3vw, 40px);
      line-height: 1.05;
    }

    .dialog-subtitle {
      margin: -3px 0 14px;
      color: rgba(255, 255, 255, 0.86);
      font-size: clamp(14px, 1.4vw, 18px);
      font-weight: 600;
      line-height: 1.35;
    }

    .dialog-copy {
      max-width: 680px;
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      line-height: 1.6;
    }

    .dialog-copy > :first-child { margin-top: 0; }
    .dialog-copy > :last-child { margin-bottom: 0; }

    .dialog-button-grid {
      display: grid;
      grid-template-columns: repeat(var(--dialog-columns, 2), minmax(0, 1fr));
      grid-template-rows: repeat(var(--dialog-rows, 1), minmax(74px, auto));
      grid-auto-rows: minmax(74px, auto);
      gap: 10px;
      margin-top: 28px;
    }

    .dialog-action,
    .dialog-placeholder {
      display: flex;
      min-width: 0;
      min-height: 74px;
      padding: 7px;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
      text-decoration: none;
    }

    .dialog-action {
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .dialog-action:hover,
    .dialog-action:focus-visible {
      border-color: rgba(255, 192, 30, 0.72);
      background: rgba(255, 255, 255, 0.13);
      outline: none;
      transform: translateY(-2px);
    }

    .dialog-action.is-disabled {
      cursor: default;
      pointer-events: none;
    }

    .dialog-footer.is-disabled {
      cursor: default;
      pointer-events: none;
    }

    .dialog-action__thumbnail {
      display: grid;
      flex: 0 0 66px;
      width: 66px;
      height: 58px;
      padding: 4px;
      place-items: center;
      overflow: hidden;
      border-radius: 7px;
      background: #fff;
    }

    .dialog-action__thumbnail.has-no-background {
      padding: 0;
      border-radius: 0;
      background: transparent;
    }

    .dialog-action__thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: var(--thumbnail-fit, contain);
      object-position: var(--thumbnail-position-x, 50%) var(--thumbnail-position-y, 50%);
    }

    .dialog-action__copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    .dialog-action__label {
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .dialog-action__subtitle {
      min-width: 0;
      color: rgba(255, 255, 255, 0.66);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
    }

    .dialog-footer {
      min-height: 58px;
      justify-content: center;
      color: #111;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: color 180ms ease, background 180ms ease;
    }

    .dialog-footer:hover,
    .dialog-footer:focus-visible {
      color: #8d6200;
      background: #f4f4f4;
      outline: none;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      background: #fff;
      pointer-events: none;
      transition: opacity 320ms ease, visibility 0s linear 320ms;
    }

    #loading-overlay.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 320ms ease, visibility 0s;
    }

    .loader-fallback {
      position: absolute;
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 0, 0, 0.16);
      border-top-color: #222;
      border-radius: 50%;
      animation: loader-spin 800ms linear infinite;
      transition: opacity 180ms ease;
    }

    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px), (max-aspect-ratio: 4 / 5) {
      :root {
        --menu-height: 160px;
        --hotspot-size: 44px;
      }

      #product-menu {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        padding: 5px 6px max(8px, env(safe-area-inset-bottom, 0px));
      }

      #pan-controls {
        bottom: calc(var(--menu-height) + 10px);
        width: calc(100% - 18px);
        height: 48px;
        padding: 3px 8px;
        gap: 6px;
      }

      .pan-arrow {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
      }

      .product-button {
        gap: 6px;
        padding: 3px 4px;
      }

      .product-button__icon {
        width: 32px;
        height: 21px;
      }

      .product-button__label { font-size: 9px; }
      .hotspot { box-shadow: 0 0 0 8px rgba(0, 0, 0, 0.16); }

      #dialog-layer { padding: 12px; }
      #product-dialog { width: 94vw; max-height: 82vh; }
      .dialog-header { min-height: 64px; padding: 12px 15px; }
      .dialog-body { padding: 22px 18px; }

      /* Avoid expensive live background blurs on mobile GPUs. */
      #product-menu,
      #pan-controls,
      .dialog-body {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      #product-menu { background: rgba(0, 0, 0, 0.72); }
      #pan-controls { background: rgba(0, 0, 0, 0.72); }
      .dialog-body { background: rgba(0, 0, 0, 0.82); }
      .dialog-action__thumbnail {
        flex-basis: 54px;
        width: 54px;
        height: 50px;
      }
    }
  </style>
</head>

<body>
  <main id="hero" aria-label="Product hotspot hero">
    <img id="hero-sequence" class="hero-frame" src="zoom 1280 x 720/intro00.jpg" alt="" draggable="false" decoding="async" fetchpriority="high" />
    <img id="hero-high-res" class="hero-frame" src="Sequence 1280 x 720/hero36.jpg" alt="" draggable="false" decoding="async" fetchpriority="high" />

    <div id="over-layer" aria-hidden="true">
      <img class="hero-frame product-over" data-product="lux" data-src="Overs/Lux.jpg" alt="" />
      <img class="hero-frame product-over" data-product="armourSide" data-src="Overs/Armour Side.jpg" alt="" />
      <img class="hero-frame product-over" data-product="rainware" data-src="Overs/Rainware.jpg" alt="" />
      <img class="hero-frame product-over" data-product="soffit" data-src="Overs/Wayne.jpg" alt="" />
      <img class="hero-frame product-over" data-product="metalLab" data-src="Overs/Metal Lab.jpg" alt="" />
      <img class="hero-frame product-over" data-product="oronX" data-src="Overs/Orion X.jpg" alt="" />
    </div>

    <div id="hotspot-layer" aria-label="Product hotspots"></div>

    <div id="pan-controls" aria-label="Horizontal panorama controls">
      <button id="pan-left" class="pan-arrow" type="button" aria-label="Pan image left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
      </button>
      <input id="pan-slider" type="range" min="0" max="1000" value="500" aria-label="Horizontal image position" />
      <button id="pan-right" class="pan-arrow" type="button" aria-label="Pan image right">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </button>
    </div>

    <nav id="product-menu" aria-label="Product categories">
      <button class="product-button" type="button" data-product="lux">
        <span class="product-button__icon"><img src="Logo's/LUX-Icon.svg" alt="" /></span>
        <span class="product-button__label">LUX Architectural Products</span>
      </button>

      <button class="product-button" type="button" data-product="armourSide">
        <span class="product-button__icon"><img src="Logo's/ArmourSide-Icon.svg" alt="" /></span>
        <span class="product-button__label">Armour Side</span>
      </button>

      <button class="product-button" type="button" data-product="rainware">
        <span class="product-button__icon"><img src="Logo's/Rainware-Icon.svg" alt="" /></span>
        <span class="product-button__label">Rainware</span>
      </button>

      <button class="product-button" type="button" data-product="soffit">
        <span class="product-button__icon"><img src="Logo's/Wayne-Icon.svg" alt="" /></span>
        <span class="product-button__label">Soffit and Fascia</span>
      </button>

      <button class="product-button" type="button" data-product="metalLab">
        <span class="product-button__icon"><img src="Logo's/MetalLab-Icon.svg" alt="" /></span>
        <span class="product-button__label">Metal Lab Roofing</span>
      </button>

      <button class="product-button" type="button" data-product="oronX">
        <span class="product-button__icon"><img src="Logo's/OronX-Icon.svg" alt="" /></span>
        <span class="product-button__label">OrionX Lighting</span>
      </button>
    </nav>

    <div id="dialog-layer" aria-hidden="true">
      <section id="product-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <header class="dialog-header">
          <div id="dialog-brand"></div>
          <button id="dialog-close" type="button" aria-label="Close product window">&times;</button>
        </header>

        <div class="dialog-body">
          <p id="dialog-eyebrow" class="dialog-eyebrow">Product information</p>
          <h2 id="dialog-title">Product</h2>
          <p id="dialog-subtitle" class="dialog-subtitle" hidden></p>
          <div id="dialog-copy" class="dialog-copy">
            This window is ready for the final product description, specifications, imagery and links.
          </div>
          <div id="dialog-button-grid" class="dialog-button-grid"></div>
        </div>

        <a id="dialog-shop-all" class="dialog-footer" href="#" target="_top">SHOP ALL</a>
      </section>
    </div>

    <div id="loading-overlay" role="status" aria-label="Loading" aria-live="polite">
      <div class="loader-fallback" aria-hidden="true"></div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const INTRO_FPS = 24;
      const FIRST_FRAME = 0;
      const LAST_FRAME = 32;
      const SEQUENCE_FPS = 24;
      const SEQUENCE_FIRST_FRAME = 0;

      const DEFAULT_DIALOG_COPY =

      let viewerConfig = { version: 1, products: {} };

        { id: "hotspot1", product: "armourSide", x: 23.24, y: 53.72 },
        { id: "hotspot2", product: "oronX", x: 24.66, y: 35.26 },
        { id: "hotspot3", product: "lux", x: 40.20, y: 53.79 },
        { id: "hotspot4", product: "metalLab", x: 49.32, y: 31.56 },
        { id: "hotspot5", product: "soffit", x: 72.61, y: 31.84 },
        { id: "hotspot6", product: "rainware", x: 85.98, y: 44.56 }

      const hero = document.getElementById("hero");
      const sequenceImage = document.getElementById("hero-sequence");
      const highResImage = document.getElementById("hero-high-res");
      const hotspotLayer = document.getElementById("hotspot-layer");
      const overImages = [...document.querySelectorAll(".product-over")];
      const dialogLayer = document.getElementById("dialog-layer");
      const dialogBrand = document.getElementById("dialog-brand");
      const dialogEyebrow = document.getElementById("dialog-eyebrow");
      const dialogTitle = document.getElementById("dialog-title");
      const dialogSubtitle = document.getElementById("dialog-subtitle");
      const dialogCopy = document.getElementById("dialog-copy");
      const dialogButtonGrid = document.getElementById("dialog-button-grid");
      const dialogShopAll = document.getElementById("dialog-shop-all");
      const dialogClose = document.getElementById("dialog-close");
      const loadingOverlay = document.getElementById("loading-overlay");
      const lottieLoader = document.getElementById("lottie-loader");
      const panControls = document.getElementById("pan-controls");

      const panLeft = document.getElementById("pan-left");
      const panRight = document.getElementById("pan-right");
      const desktopHoverQuery = window.matchMedia("(hover: hover) and (pointer: fine)");
      // Hold only the currently selected half of the product sequence.
      // Intro frames are not retained as Image objects after preloading.
      const heroFrames = new Map();
      let activeOverProduct = null;
      let loaderDelayTimer = null;
      let currentHeroFrame = DEFAULT_HERO_FRAME;
      let selectedProduct = null;
      let isBusy = false;
      let productFlowActive = false;
      let experienceReady = false;
      let scrollAwayActive = false;
      let scrollProgress = 0;
      let lastScrollFrame = LAST_FRAME;
      let scrollUpdatePending = false;
      let externalScrollControl = false;
      let readScrollProgress = () => scrollProgress;
      let panProgress = 0.5;
      let panEnabled = false;
      let panAnimationFrame = 0;

      // Lightweight CSS loading spinner replaces the Lottie library on mobile.
      // This eliminates a third-party script and animation JSON download.

      }

      function hideLoader() {

      async function ensureHeroFramesReady(targetFrame) {

          // Only load the 36-37 frames used by the selected hotspot.

      function introFramePath(frame) {
        return `zoom 1280 x 720/intro${String(frame).padStart(2, "0")}.jpg`;
      }

      function heroFramePath(frame) {
        return `Sequence 1280 x 720/hero${String(frame).padStart(2, "0")}.jpg`;
      }

      function wait(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      }

      function preloadImage(src) {
        return new Promise((resolve) => {
          const image = new Image();
          image.decoding = "async";
          image.onload = () => resolve(image);
          image.onerror = () => {
            console.warn(`Could not load image: ${src}`);
            resolve(null);
          };
          image.src = src;
        });
      }

      // Bounded requests rather than one Promise.all that downloads everything at once.
      async function preloadWithLimit(items, limit, onLoaded, isCancelled = () => false) {
        let nextIndex = 0;
        const workerCount = Math.min(items.length, limit);
        const workers = Array.from({ length: workerCount }, async () => {
          while (!isCancelled()) {
            const index = nextIndex++;
            if (index >= items.length) return;
            const item = items[index];
            const image = await preloadImage(item.url);
            if (isCancelled()) return;
            if (onLoaded) onLoaded(item, image);
          }
        });
        await Promise.all(workers);
        return !isCancelled();
      }

      async function loadIntroFrames(isCancelled) {
        // Frame 00 is already being fetched by the visible <img> tag.
        const frames = Array.from({ length: LAST_FRAME - FIRST_FRAME }, (_, i) => ({
          frame: FIRST_FRAME + i + 1,
          url: introFramePath(FIRST_FRAME + i + 1)
        }));
        let failedFrames = 0;
        const completed = await preloadWithLimit(
          frames,
          INTRO_PRELOAD_CONCURRENCY,
          (_item, image) => { if (!image) failedFrames += 1; },
          isCancelled
        );
        // No Image[] retained: browser HTTP cache can serve these URLs in playback.
        return completed && failedFrames === 0;
      }

      async function loadHeroFrames(targetFrame) {
        heroFrames.clear();
        const direction = targetFrame >= DEFAULT_HERO_FRAME ? 1 : -1;
        const frameCount = Math.abs(targetFrame - DEFAULT_HERO_FRAME) + 1;
        // Request in playback order, beginning at hero36.
        const frames = Array.from({ length: frameCount }, (_, i) => {
          const frame = DEFAULT_HERO_FRAME + i * direction;
          return { frame, url: heroFramePath(frame) };
        });
        await preloadWithLimit(frames, HERO_PRELOAD_CONCURRENCY, (item, image) => {
          if (image) heroFrames.set(item.frame, image);
        });
      }

      function waitForHighRes() {
        if (highResImage.complete) return Promise.resolve(highResImage.naturalWidth > 0);
        return new Promise((resolve) => {
          highResImage.addEventListener("load", () => resolve(true), { once: true });
          highResImage.addEventListener("error", () => resolve(false), { once: true });
        });
      }

      function playIntro() {
        return new Promise((resolve) => {
          const frameDuration = 1000 / INTRO_FPS;
          const totalFrames = LAST_FRAME - FIRST_FRAME + 1;
          const startTime = performance.now();
          let lastDisplayedIndex = -1;

          function update(now) {
            const frameIndex = Math.min(Math.floor((now - startTime) / frameDuration), totalFrames - 1);
            if (frameIndex !== lastDisplayedIndex) {
              sequenceImage.src = introFramePath(FIRST_FRAME + frameIndex);
              lastDisplayedIndex = frameIndex;
            }
            if (frameIndex < totalFrames - 1) requestAnimationFrame(update);
            else resolve();
          }

          requestAnimationFrame(update);
        });
      }

      function getCoverMetrics() {
        const containerWidth = hero.clientWidth;
        const containerHeight = hero.clientHeight;
        const imageWidth = highResImage.naturalWidth || 1920;
        const imageHeight = highResImage.naturalHeight || 1080;
        const scale = Math.max(containerWidth / imageWidth, containerHeight / imageHeight);
        const renderedWidth = imageWidth * scale;
        const renderedHeight = imageHeight * scale;
        const overflowX = Math.max(renderedWidth - containerWidth, 0);
        return {
          offsetX: -overflowX * panProgress,
          offsetY: (containerHeight - renderedHeight) / 2,
          renderedWidth,
          renderedHeight,
          overflowX
        };
      }

      function positionHotspots(metrics = getCoverMetrics()) {
        hotspotLayer.querySelectorAll(".hotspot").forEach((button) => {
          button.style.left = `${metrics.offsetX + (Number(button.dataset.x) / 100) * metrics.renderedWidth}px`;
          button.style.top = `${metrics.offsetY + (Number(button.dataset.y) / 100) * metrics.renderedHeight}px`;
        });
      }

      function setPanProgress(progress) {
        panProgress = clamp(progress, 0, 1);
        hero.style.setProperty("--pan-position", `${panProgress * 100}%`);
        const metrics = getCoverMetrics();

        /* Keep hotspots on the exact same source-image coordinates as every frame. */
        positionHotspots(metrics);
        panSlider.value = String(Math.round(panProgress * 1000));
        panSlider.style.setProperty("--slider-fill", `${panProgress * 100}%`);
      }

      function easeInOutQuint(progress) {
        return progress < 0.5
          ? 16 * progress ** 5
          : 1 - ((-2 * progress + 2) ** 5) / 2;
      }

      function easeInOutExpo(progress) {
        if (progress === 0 || progress === 1) return progress;
        return progress < 0.5
          ? (2 ** (20 * progress - 10)) / 2
          : (2 - 2 ** (-20 * progress + 10)) / 2;
      }

      function cancelPanAnimation(autoOnly = false) {
        if (autoOnly && !panAnimationIsAuto) return;
        if (panAnimationFrame) cancelAnimationFrame(panAnimationFrame);
        panAnimationFrame = 0;
        panAnimationIsAuto = false;
      }

      function animatePanTo(
        target,
        duration,
        onComplete = null,
        isAuto = false,
        easing = easeInOutQuint

        cancelPanAnimation();
        const start = panProgress;
        const distance = target - start;

        if (Math.abs(distance) < 0.0001) {
          setPanProgress(target);

          return;

        panAnimationIsAuto = isAuto;

          } else {

            panAnimationIsAuto = false;

      function bindPanEvents() {
        let startedOnHotspot = false;

        hero.addEventListener("pointerdown", (event) => {
          registerPanInteraction();

          if (event.target.closest("#pan-controls, #product-menu, #dialog-layer, #loading-overlay")) return;

          cancelPanAnimation();
          panPointerId = event.pointerId;
          panPointerStartX = event.clientX;
          panPointerStartY = event.clientY;
          panLastX = event.clientX;

      function renderHotspots() {

        });

      }

      function displayHeroFrame(frame) {
        const image = heroFrames.get(frame);
        highResImage.src = image ? image.src : heroFramePath(frame);
        currentHeroFrame = frame;
      }

      function playHeroSequence(fromFrame, toFrame) {
        return new Promise((resolve) => {
          const direction = toFrame >= fromFrame ? 1 : -1;
          const totalSteps = Math.abs(toFrame - fromFrame);
          const frameDuration = 1000 / SEQUENCE_FPS;
          const startTime = performance.now();
          let lastStep = -1;

          function update(now) {
            const step = Math.min(Math.floor((now - startTime) / frameDuration), totalSteps);

            if (step !== lastStep) {
              displayHeroFrame(fromFrame + step * direction);
              lastStep = step;
            }

            if (step < totalSteps) requestAnimationFrame(update);
            else resolve();
          }

          requestAnimationFrame(update);
        });
      }

      function heroSequenceDuration(fromFrame, toFrame) {
        return Math.abs(toFrame - fromFrame) * (1000 / SEQUENCE_FPS);
      }

      function clamp(value, minimum, maximum) {
        return Math.min(Math.max(value, minimum), maximum);
      }

      function displayScrollFrame(progress) {
        const frame = LAST_FRAME - Math.round(progress * (LAST_FRAME - FIRST_FRAME));
        if (frame === lastScrollFrame) return;

        sequenceImage.src = introFramePath(frame);
        lastScrollFrame = frame;
      }

      function scrollSequenceProgress(progress) {
        return clamp(
          (progress - SCROLL_SEQUENCE_START_THRESHOLD) /
            (1 - SCROLL_SEQUENCE_START_THRESHOLD),
          0,
          1
        );
      }

      function applyScrollProgress(progress) {
        const nextProgress = clamp(progress, 0, 1);
        const scrollingDown = nextProgress > scrollProgress + 0.0005;
        const scrollingUp = nextProgress < scrollProgress - 0.0005;
        scrollProgress = nextProgress;

        if (scrollingDown || scrollingUp) registerPanInteraction();

        if (!experienceReady || productFlowActive || isBusy || dialogLayer.classList.contains("is-open")) {
          return;
        }

        const zoomSequenceActive = scrollProgress > SCROLL_SEQUENCE_START_THRESHOLD;

        if (zoomSequenceActive) {
          if (!scrollAwayActive) {
            scrollAwayActive = true;
            hoveredMenuProduct = null;
            cancelPanAnimation();
            clearOverState();
          }

          /* Disable every product control before exposing a zoom frame. */
          hero.classList.add("scrolling-away", "sequence-active");
          hero.classList.remove("hotspots-visible");
          displayScrollFrame(scrollSequenceProgress(scrollProgress));
        } else {
          hero.classList.remove("scrolling-away");
          displayScrollFrame(0);

          if (scrollAwayActive) {
            scrollAwayActive = false;
            showInterface();
          }

      }

      function scheduleScrollUpdate() {
        if (scrollUpdatePending) return;
        scrollUpdatePending = true;

        requestAnimationFrame(() => {
          scrollUpdatePending = false;
          applyScrollProgress(readScrollProgress());
        });
      }

      function setupScrollExperience() {
        const scrollDistance = () => Math.max(hero.clientHeight * SCROLL_ZOOM_DISTANCE_FACTOR, 1);

        if (window.parent !== window) {
          try {
            const parentWindow = window.parent;
            void parentWindow.document.documentElement;
            const baseline = parentWindow.scrollY;

            readScrollProgress = () => clamp(
              (parentWindow.scrollY - baseline) / scrollDistance(),
              0,
              1
            );

            parentWindow.addEventListener("scroll", scheduleScrollUpdate, { passive: true });
            parentWindow.addEventListener("resize", scheduleScrollUpdate, { passive: true });
            return;
          } catch (error) {
            // A cross-origin Elementor iframe is handled below.
          }
        }

        if (window.parent === window) {
          const baseline = window.scrollY;
          readScrollProgress = () => clamp(
            (window.scrollY - baseline) / scrollDistance(),
            0,
            1
          );
          window.addEventListener("scroll", scheduleScrollUpdate, { passive: true });
          window.addEventListener("resize", scheduleScrollUpdate, { passive: true });
          return;
        }

        if ("IntersectionObserver" in window) {
          let highestVisibleRatio = 0;
          const thresholds = Array.from({ length: 101 }, (_, index) => index / 100);

          const observer = new IntersectionObserver((entries) => {
            if (externalScrollControl) return;
            const entry = entries[0];
            if (!entry) return;

            highestVisibleRatio = Math.max(highestVisibleRatio, entry.intersectionRatio);
            const visibleRatio = highestVisibleRatio > 0
              ? entry.intersectionRatio / highestVisibleRatio
              : 1;
            const progress = clamp(
              (1 - visibleRatio) / SCROLL_ZOOM_DISTANCE_FACTOR,
              0,
              1
            );

            readScrollProgress = () => progress;
            applyScrollProgress(progress);
          }, { threshold: thresholds });

          observer.observe(hero);
        }
      }

      // Large hover JPGs are loaded only when the corresponding product is used.
      // On touch devices this avoids downloading all six overlays at startup.

      function showOverState(product) {
        activeOverProduct = product;

        overImages.forEach((image) => {
          const shouldShow = image.dataset.product === product;
          if (!shouldShow) image.classList.remove("is-visible");

          if (shouldShow) {
            const reveal = () => {
              if (activeOverProduct === product) image.classList.add("is-visible");
            };

            if (!image.getAttribute("src")) {
              image.decoding = "async";
              image.src = image.dataset.src;
            }
            if (image.complete && image.naturalWidth > 0) reveal();
            else image.addEventListener("load", reveal, { once: true });
          }
        });
      }

      function hideOverState(product) {
        if (activeOverProduct !== product) return;
        activeOverProduct = null;
        overImages.forEach((image) => image.classList.remove("is-visible"));
      }

      function clearOverState() {
        activeOverProduct = null;
        overImages.forEach((image) => image.classList.remove("is-visible"));
      }

      function bindOverStateEvents() {
        document.querySelectorAll("[data-product]").forEach((element) => {
          if (element.classList.contains("product-over")) return;
          const product = element.dataset.product;
          element.addEventListener("pointerenter", () => {
            const portraitButtonPan = (
              element.classList.contains("product-button") &&
              desktopHoverQuery.matches &&
              panEnabled
            );
            if (!portraitButtonPan) showOverState(product);
          });
          element.addEventListener("pointerleave", () => hideOverState(product));
          element.addEventListener("focus", () => showOverState(product));
          element.addEventListener("blur", () => hideOverState(product));
        });
      }

      function bindProductButtonClicks() {
        document.querySelectorAll(".product-button").forEach((button) => {
          const matchingHotspot = hotspots.find((hotspot) => hotspot.product === button.dataset.product);
          if (matchingHotspot) {
            button.addEventListener("click", () => openProduct(matchingHotspot));
            button.addEventListener("pointerenter", () => {
              if (
                !desktopHoverQuery.matches ||
                !panEnabled ||
                !experienceReady ||
                productFlowActive ||
                isBusy ||
                scrollAwayActive ||
                dialogLayer.classList.contains("is-open")
              ) return;

              hoveredMenuProduct = matchingHotspot.product;
              registerPanInteraction();
              const metrics = getCoverMetrics();
              const sourceX = (matchingHotspot.x / 100) * metrics.renderedWidth;
              const targetProgress = clamp(
                (sourceX - hero.clientWidth / 2) / Math.max(metrics.overflowX, 1),
                0,
                1
              );
              animatePanTo(
                targetProgress,
                PAN_BUTTON_HOVER_DURATION,
                () => {
                  if (
                    hoveredMenuProduct === matchingHotspot.product &&
                    desktopHoverQuery.matches &&
                    panEnabled &&
                    !productFlowActive &&
                    !isBusy
                  ) showOverState(matchingHotspot.product);
                },
                false,
                easeInOutExpo
              );
            });
            button.addEventListener("pointerleave", () => {
              if (hoveredMenuProduct !== matchingHotspot.product) return;
              hoveredMenuProduct = null;
              registerPanInteraction();
            });
          }
        });
      }

      function normalizeViewerConfig(value) {
        if (!value || typeof value !== "object") return { version: 1, products: {} };
        const products = value.products && typeof value.products === "object"
          ? value.products
          : {};
        return { version: 1, products };
      }

      function linkTarget(isNewTab) {
        return isNewTab ? "_blank" : "_top";
      }

      function applyLinkAttributes(element, link) {
        const url = typeof link?.url === "string" ? link.url.trim() : "";
        element.href = url || "#";
        element.target = linkTarget(Boolean(link?.newTab));
        const rel = ["noopener", link?.newTab ? "noreferrer" : "", link?.nofollow ? "nofollow" : ""]
          .filter(Boolean)
          .join(" ");
        element.rel = rel;
        element.classList.toggle("is-disabled", !url);
        element.setAttribute("aria-disabled", url ? "false" : "true");
        element.onclick = url ? null : (event) => event.preventDefault();
      }

      function appendFallbackBrand(product) {
        dialogBrand.classList.remove("is-custom");
        dialogBrand.innerHTML = `<img src="${product.icon}" alt="" /><span>${product.label}</span>`;
      }

      function renderDialogButtons(buttons, columns, rows) {
        dialogButtonGrid.replaceChildren();
        dialogButtonGrid.style.setProperty("--dialog-columns", String(columns));
        dialogButtonGrid.style.setProperty("--dialog-rows", String(rows));

        if (!buttons.length) {
          for (let index = 0; index < 3; index += 1) {
            const placeholder = document.createElement("div");
            placeholder.className = "dialog-placeholder";
            placeholder.setAttribute("aria-hidden", "true");
            dialogButtonGrid.appendChild(placeholder);
          }
          return;
        }

        buttons.slice(0, 48).forEach((button) => {
          const action = document.createElement("a");
          action.className = "dialog-action";
          applyLinkAttributes(action, button);

          const thumbnailUrl = typeof button?.thumbnail?.url === "string"
            ? button.thumbnail.url.trim()
            : "";
          if (thumbnailUrl) {
            const thumbnail = document.createElement("span");
            thumbnail.className = "dialog-action__thumbnail";
            if (button.showThumbnailBackground === false) {
              thumbnail.classList.add("has-no-background");
            }
            const thumbnailFit = button.thumbnailFit === "cover" ? "cover" : "contain";
            const rawPositionX = Number(button.thumbnailPositionX);
            const rawPositionY = Number(button.thumbnailPositionY);
            const thumbnailPositionX = Number.isFinite(rawPositionX)
              ? clamp(rawPositionX, 0, 100)
              : 50;
            const thumbnailPositionY = Number.isFinite(rawPositionY)
              ? clamp(rawPositionY, 0, 100)
              : 50;
            thumbnail.style.setProperty("--thumbnail-fit", thumbnailFit);
            thumbnail.style.setProperty("--thumbnail-position-x", `${thumbnailPositionX}%`);
            thumbnail.style.setProperty("--thumbnail-position-y", `${thumbnailPositionY}%`);
            const image = document.createElement("img");
            image.src = thumbnailUrl;
            image.alt = typeof button.thumbnail.alt === "string" ? button.thumbnail.alt : "";
            image.decoding = "async";
            thumbnail.appendChild(image);
            action.appendChild(thumbnail);
          }

          const copy = document.createElement("span");
          copy.className = "dialog-action__copy";
          const label = document.createElement("span");
          label.className = "dialog-action__label";
          label.textContent = typeof button?.label === "string" ? button.label : "";
          copy.appendChild(label);

          const subtitleText = typeof button?.subtitle === "string" ? button.subtitle.trim() : "";
          if (subtitleText) {
            const subtitle = document.createElement("span");
            subtitle.className = "dialog-action__subtitle";
            subtitle.textContent = subtitleText;
            copy.appendChild(subtitle);
          }

          action.appendChild(copy);
          dialogButtonGrid.appendChild(action);
        });
      }

      function setDialogProduct(productKey) {
        const product = PRODUCT_DETAILS[productKey];
        if (!product) return;
        const config = viewerConfig.products[productKey] || {};
        const customLogoUrl = typeof config?.logo?.url === "string" ? config.logo.url.trim() : "";

        if (customLogoUrl) {
          dialogBrand.classList.add("is-custom");
          dialogBrand.replaceChildren();
          const image = document.createElement("img");
          image.src = customLogoUrl;
          image.alt = typeof config.logo.alt === "string" ? config.logo.alt : "";
          image.decoding = "async";
          dialogBrand.appendChild(image);
        } else {
          appendFallbackBrand(product);
        }

        dialogEyebrow.textContent = typeof config.eyebrow === "string"
          ? config.eyebrow
          : "Product information";
        dialogEyebrow.hidden = !dialogEyebrow.textContent.trim();
        dialogTitle.textContent = typeof config.title === "string" && config.title.trim()
          ? config.title
          : product.label;
        dialogSubtitle.textContent = typeof config.subtitle === "string" ? config.subtitle : "";
        dialogSubtitle.hidden = !dialogSubtitle.textContent.trim();
        dialogCopy.innerHTML = typeof config.descriptionHtml === "string"
          ? config.descriptionHtml
          : DEFAULT_DIALOG_COPY;
        dialogCopy.hidden = !dialogCopy.textContent.trim() && !dialogCopy.querySelector("img");

        const columns = clamp(Math.round(Number(config.columns) || 2), 1, 4);
        const rows = clamp(Math.round(Number(config.rows) || 3), 1, 8);
        const buttons = Array.isArray(config.buttons) ? config.buttons : [];
        renderDialogButtons(buttons, columns, rows);

        const shopAll = config.shopAll && typeof config.shopAll === "object" ? config.shopAll : {};
        dialogShopAll.textContent = typeof shopAll.label === "string" && shopAll.label.trim()
          ? shopAll.label
          : "SHOP ALL";
        applyLinkAttributes(dialogShopAll, shopAll);
      }

      async function hideInterface() {
        clearOverState();
        hero.classList.add("sequence-active");
        hero.classList.remove("hotspots-visible");
        await wait(HOTSPOT_HIDE_TIME);
      }

      function showInterface() {
        hero.classList.remove("sequence-active");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => hero.classList.add("hotspots-visible"));
        });
      }

      async function openProduct(hotspot) {
        const liveScrollProgress = clamp(readScrollProgress(), 0, 1);
        if (
          isBusy ||
          scrollAwayActive ||
          liveScrollProgress > SCROLL_SEQUENCE_START_THRESHOLD ||
          dialogLayer.classList.contains("is-open")
        ) return;

        hoveredMenuProduct = null;
        registerPanInteraction();
        cancelPanAnimation();
        hero.classList.remove("scrolling-away");
        hero.classList.add("product-flow");
        displayScrollFrame(0);
        isBusy = true;
        productFlowActive = true;
        selectedProduct = hotspot.product;
        const targetFrame = hotspot.x < 50 ? SEQUENCE_FIRST_FRAME : SEQUENCE_LAST_FRAME;
        const revealDelay = Math.max(
          0,
          heroSequenceDuration(DEFAULT_HERO_FRAME, targetFrame) - DIALOG_REVEAL_LEAD
        );

        const hotspotExit = hideInterface();
        await ensureHeroFramesReady(targetFrame);
        const sequencePlayback = playHeroSequence(DEFAULT_HERO_FRAME, targetFrame);
        const dialogReveal = wait(revealDelay).then(() => {
          setDialogProduct(selectedProduct);
          dialogLayer.setAttribute("aria-hidden", "false");
          dialogLayer.classList.add("is-open");
        });

        await Promise.all([hotspotExit, sequencePlayback, dialogReveal]);
        isBusy = false;
        dialogClose.focus({ preventScroll: true });
      }

      async function closeProduct() {
        if (isBusy || !dialogLayer.classList.contains("is-open")) return;

        registerPanInteraction();
        isBusy = true;
        dialogLayer.classList.remove("is-open");
        dialogLayer.setAttribute("aria-hidden", "true");
        const dialogExit = wait(DIALOG_TRANSITION_TIME);
        const reversePlayback = playHeroSequence(currentHeroFrame, DEFAULT_HERO_FRAME);
        const interfaceReturnDelay = Math.max(
          0,
          heroSequenceDuration(currentHeroFrame, DEFAULT_HERO_FRAME) - HOTSPOT_RETURN_LEAD
        );
        const interfaceReturn = wait(interfaceReturnDelay).then(() => {
          if (scrollProgress <= SCROLL_HIDE_THRESHOLD) showInterface();
        });

        await Promise.all([dialogExit, reversePlayback, interfaceReturn]);
        // Drop 36-37 retained decoded frame objects after the reverse completes.
        heroFrames.clear();
        selectedProduct = null;
        isBusy = false;
        productFlowActive = false;
        hero.classList.remove("product-flow");
        scheduleScrollUpdate();
      }

      function shouldSkipIntro() {
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const verySlowConnection = connection && ["slow-2g", "2g"].includes(connection.effectiveType);
        const lowMemoryDevice = typeof navigator.deviceMemory === "number" && navigator.deviceMemory <= 2;
        return Boolean(
          connection?.saveData ||
          verySlowConnection ||
          lowMemoryDevice ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
      }

      async function startHero() {
        const highResReady = waitForHighRes();
        let introWasPlayed = false;

        if (!shouldSkipIntro()) {
          // Do not hold low-end phones on a full-screen loader for 33 files.
          // On a fast/cached connection, the intro still plays exactly as before.
          let cancelIntroPreload = false;
          const introReady = loadIntroFrames(() => cancelIntroPreload);
          const readyInTime = await Promise.race([
            introReady,
            wait(INTRO_STARTUP_BUDGET_MS).then(() => false)
          ]);
          if (readyInTime) {
            await playIntro();
            introWasPlayed = true;
          } else {
            // Prevent queued images from starting; at most four requests remain in flight.
            cancelIntroPreload = true;
          }
        }

        if (!introWasPlayed) {
          // The final intro image remains available for the reverse-scroll effect.
          sequenceImage.src = introFramePath(LAST_FRAME);
          lastScrollFrame = LAST_FRAME;
        }

        // The poster loads in parallel; never block product controls on it.
        if (highResImage.complete && highResImage.naturalWidth > 0) {
          highResImage.classList.add("is-visible");
        } else {
          highResReady.then((ready) => {
            if (ready) highResImage.classList.add("is-visible");
          });
        }
        renderHotspots();
        updatePanAvailability();
        bindOverStateEvents();
        bindProductButtonClicks();
        requestAnimationFrame(() => {
          hero.classList.add("ui-ready");
          requestAnimationFrame(() => {
            hero.classList.add("hotspots-visible");
            experienceReady = true;
            scheduleAutoPan();
            scheduleScrollUpdate();
          });
        });
      }

      function handleViewportResize() {
        if (panPointerId !== null) {
          panResizePending = true;
          return;
        }
        updatePanAvailability();
      }

      window.addEventListener("resize", handleViewportResize);
      dialogClose.addEventListener("click", closeProduct);
      dialogLayer.addEventListener("pointerdown", (event) => {
        if (event.target === dialogLayer) closeProduct();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeProduct();
      });
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (!event.data || typeof event.data !== "object") return;

        if (event.data.type === "wayne-viewer-config") {
          viewerConfig = normalizeViewerConfig(event.data.config);
          return;
        }

        if (event.data.type !== "wayne-hero-scroll") return;

        const progress = Number(event.data.progress);
        if (!Number.isFinite(progress)) return;

        externalScrollControl = true;
        readScrollProgress = () => clamp(progress, 0, 1);
        applyScrollProgress(progress);
      });
      if (window.parent !== window) {
        window.parent.postMessage({ type: "wayne-viewer-ready", version: 1 }, "*");
      }
      bindPanEvents();
      setupScrollExperience();
      startHero();
    })();
  </script>
</body>
</html>
