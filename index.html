<!DOCTYPE html>
<html lang="en">
<head>
<title>HOME VIEW DEMO</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:"Futura PT",sans-serif;
}

#video-container{
width:100vw;
height:100vh;
position:relative;
z-index:1;
}

/* INTRO OVERLAY (VIDEO FIRST) */
#introOverlay{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:5000;
}

#introVideo{
width:100vw;
height:100vh;
object-fit:cover;
}

/* LOADING OVERLAY */
#loadingOverlay{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:5001;
opacity:0;
pointer-events:none;
transition:opacity 0.75s ease;
}

#mainLogo{
width:220px;
opacity:0;
transform:scale(0.94);
animation:logoIn 1.2s ease forwards;
}

@keyframes logoIn{
to{opacity:1; transform:scale(1);} 
}

#loadingRow{
margin-top:24px;
display:flex;
align-items:center;
gap:12px;
}

.spinner{
width:18px;
height:18px;
border:3px solid rgba(255,255,255,0.3);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);} 
}

#loadingText span{
opacity:0;
display:inline-block;
animation:fadeChar 0.4s forwards;
}

@keyframes fadeChar{
to{opacity:1;} 
}

#screenshotOverlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
z-index:2000;
pointer-events:none;
}

.overlayBox{
background:rgba(0,0,0,0.5);
padding:24px 32px;
border-radius:16px;
color:white;
font-size:16px;
display:flex;
align-items:center;
gap:16px;
}

</style>

<script type="module">

let Application;
let screenshotCounter = 1;

import * as PixelStreamingWebSdk from
"https://unpkg.com/@arcware-cloud/pixelstreaming-websdk@1.3.32/index.mjs";

(() => {

const { ArcwareInit } = PixelStreamingWebSdk;

const initResult=new ArcwareInit(
{shareId:"share-49b3b4a2-4484-4850-b567-5ad8d7ac0df8"},
{
initialSettings:{
AutoConnect:true,
AutoPlayVideo:true,
StartVideoMuted:false
}
}
);

Application=initResult.Application;

Application.getApplicationResponse((response)=>{

try{
const parsed=JSON.parse(response);

if(parsed.Game==="Loaded"){
Application.emitUIInteraction(JSON.stringify({
load:"homeViewDemo"
}));
}

if(parsed.Game==="HomeViewLevelLoaded"){
fadeOutLoading();
}

if(parsed.screenshot==="generating"){
showOverlay("Generating high resolution image");
}

}catch(e){}

if(response.startsWith("CreateScreenshot")){
createFile(window.file);
}

});

setTimeout(()=>{
document
.getElementById("video-container")
.appendChild(Application.rootElement);
});

window.file=Application.webRtcController.file;

})();

/* VIDEO → LOADER TRANSITION */
window.addEventListener("load",()=>{
const video=document.getElementById("introVideo");

video.play().catch(()=>{});

video.onended=()=>{
const overlay=document.getElementById("introOverlay");
const loader=document.getElementById("loadingOverlay");

overlay.style.display="none";
loader.style.opacity=1;
loader.style.pointerEvents="auto";

animateText();
};
});

function animateText(){
const text="LOADING HOME VIEW DEMO";
const container=document.getElementById("loadingText");

container.innerHTML="";

// total animation time (tweakable)
const totalDuration = 1.4;

// easing function (ease-out cubic)
function easeOutCubic(t){
return 1 - Math.pow(1 - t, 3);
}

const chars = [...text];

chars.forEach((char,i)=>{
const span=document.createElement("span");
span.textContent=char;

const t = i / (chars.length - 1);
const eased = easeOutCubic(t);
const delay = eased * totalDuration;

span.style.animationDelay = delay + "s";

container.appendChild(span);
});
}

function fadeOutLoading(){
const overlay=document.getElementById("loadingOverlay");
overlay.style.opacity=0;
setTimeout(()=>overlay.remove(),750);
}

function showOverlay(message){
document.getElementById("overlayText").innerText=message;
document.getElementById("screenshotOverlay").style.display="flex";
}

function hideOverlay(){
document.getElementById("screenshotOverlay").style.display="none";
}

function createFile(file){
const blob=new Blob(file.data,{type:file.mimetype});
const fileName=`screenshot${screenshotCounter}${file.extension}`;

const url=URL.createObjectURL(blob);
const a=document.createElement("a");

a.href=url;
a.download=fileName;

document.body.appendChild(a);
a.click();
document.body.removeChild(a);

URL.revokeObjectURL(url);

screenshotCounter++;
}

</script>

</head>

<body>

<div id="video-container"></div>

<!-- VIDEO FIRST -->
<div id="introOverlay">
<video id="introVideo" src="logo01.mp4" muted playsinline></video>
</div>

<!-- LOADER -->
<div id="loadingOverlay">
<img id="mainLogo" src="logo_2.png">
<div id="loadingRow">
<div class="spinner"></div>
<div id="loadingText"></div>
</div>
</div>

<div id="screenshotOverlay">
<div class="overlayBox">
<div class="spinner"></div>
<div id="overlayText">Generating high resolution image</div>
</div>
</div>

</body>
</html>
